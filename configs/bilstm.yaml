# Mô hình 2 — RNN/LSTM/GRU-based
run_name: bilstm_attn
family: rnn
arch: bilstm
# Tên cột được dò tự động bằng data._resolve_columns() -> không khai báo ở đây.

seed: 42
max_length: 128
emb_dim: 300
pretrained_emb: phow2v      # phow2v | fasttext | none  -> nhánh ablation
emb_path: data/raw/word2vec_vi_words_300dims.txt   # tải PhoW2V; để trống -> random init
min_freq: 2
segment: true               # tách từ tiếng Việt trước khi build vocab
num_workers: 2
hidden: 256
num_layers: 1
dropout: 0.5
batch_size: 64
epochs: 30
learning_rate: 1.0e-3
early_stopping_patience: 5
weight_decay: 0.0
clip_grad: 5.0
