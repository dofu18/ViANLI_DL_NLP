# Mô hình 3 — Transformer-based
run_name: phobert_base_v2
family: transformer
model_id: vinai/phobert-base-v2
revision: main            # ghi commit hash thật khi chốt kết quả
word_segment: true        # PhoBERT BẮT BUỘC tách từ trước
premise_col: premise      # xác nhận lại bằng datasets.describe()
hypothesis_col: hypothesis
label_col: label

seed: 42
max_length: 128
batch_size: 32
grad_accum: 1
epochs: 8
learning_rate: 2.0e-5
warmup_ratio: 0.06
weight_decay: 0.01
fp16: true
gradient_checkpointing: false
